; Target Range — mannequin hit-scoring system
;
;   node    firmware for each mannequin (piezo sensing + zone lights)
;   hub     central board: Wi-Fi AP, phone web UI, game engine
;   bench   bench-test firmware: prints piezo peaks over USB serial, no radio
;   native  unit tests for the game engine and hit arbiter (runs on the Mac)
;
; See NOTES.md for the full build / test / deploy procedure.

[platformio]
default_envs = node, hub
data_dir = data

[esp32_base]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall


[env:node]
extends = esp32_base
build_src_filter = +<node/>

[env:hub]
extends = esp32_base
build_src_filter = +<hub/>
board_build.filesystem = littlefs
board_build.partitions = partitions_hub.csv  ; 2.25 MB app, 896 KB data (kept across web updates), 768 KB web UI
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    bblanchon/ArduinoJson @ 7.4.3
extra_scripts = pre:tools/build_web.py

; Hub on the ESP32-S3 N16R8 board (16 MB flash, 8 MB octal PSRAM). The PSRAM
; gives the cloud upload's TLS session room next to the phones' page loads.
; Mannequins stay on env:node (classic ESP32); ESP-NOW works between the two.
[env:hub_s3]
extends = env:hub
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions_hub_s3.csv  ; 4 MB app x2 (OTA-ready), 4 MB data, 2 MB web UI
build_flags =
    ${esp32_base.build_flags}
    -DBOARD_HAS_PSRAM

[env:bench]
extends = esp32_base
build_src_filter = +<bench/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_ignore = esp_node_io
