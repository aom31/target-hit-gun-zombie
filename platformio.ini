; Target Range — mannequin hit-scoring system
;
;   node    firmware for each mannequin (piezo sensing + zone lights)
;   hub     central board: Wi-Fi AP, phone web UI, game engine
;   bench   bench-test firmware: prints piezo peaks over USB serial, no radio
;   native  unit tests for the game engine and hit arbiter (runs on the Mac)
;
; See NOTES.md for the full build / test / deploy procedure.

[platformio]
default_envs = node, hub
data_dir = data

[esp32_base]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall


[env:node]
extends = esp32_base
build_src_filter = +<node/>

[env:hub]
extends = esp32_base
build_src_filter = +<hub/>
board_build.filesystem = littlefs
board_build.partitions = partitions_hub.csv  ; 2.25 MB app, 896 KB data (kept across web updates), 768 KB web UI
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
    bblanchon/ArduinoJson @ 7.4.3
extra_scripts = pre:tools/build_web.py

[env:bench]
extends = esp32_base
build_src_filter = +<bench/>

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
lib_ignore = esp_node_io
